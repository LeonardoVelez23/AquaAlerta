<text x="40" y="50" font-size="28" font-weight="700" fill="#17252f">AquaAlerta · Conexiones Arduino UNO + ESP32 (Wokwi)</text>
<text x="40" y="78" font-size="15" fill="#5b6b77">El UNO mide los niveles y maneja la entrada y el batidor; le envía al ESP32 por serie (D7 → GPIO16) los niveles y la etapa. El ESP32 mide la calidad del agua y maneja PAC, filtro, purga y cloro.</text>
