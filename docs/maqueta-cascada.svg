<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="cR1"><rect x="380" y="180" width="200" height="230" rx="18"/></clipPath>
    <clipPath id="cR2"><rect x="880" y="670" width="200" height="230" rx="18"/></clipPath>
    <pattern id="grava" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#a49b8c"/><circle cx="4" cy="4" r="3.2" fill="#7d7466"/><circle cx="12" cy="9" r="3.5" fill="#8d8475"/>
    </pattern>
    <pattern id="gravilla" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#c9c1b2"/><circle cx="2" cy="2" r="1.4" fill="#9e9586"/><circle cx="6" cy="6" r="1.6" fill="#a99f90"/>
    </pattern>
    <pattern id="arena" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ecdba8"/><circle cx="1.5" cy="2" r=".8" fill="#cfb878"/><circle cx="4.5" cy="4.5" r=".7" fill="#d6c085"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b77"/>
    </marker>
    <style>
      .tit{font-size:30px;font-weight:700;fill:#17252f}
      .sub{font-size:16px;fill:#5b6b77}
      .etapa{font-size:17px;font-weight:700;fill:#17252f}
      .nota{font-size:13px;fill:#5b6b77}
      .num circle{fill:#17252f}
      .num text{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
      .vidrio{fill:#eef6fb;stroke:#7a96a8;stroke-width:3}
      .tapa{fill:#5b6b77}
      .mueble{fill:#b98b5a;stroke:#8a6239;stroke-width:2}
      .pata{stroke:#8a6239;stroke-width:6;stroke-linecap:round}
      .cruda{fill:none;stroke:#9c6b30;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .clara{fill:none;stroke:#6aa5c9;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .filtrada{fill:none;stroke:#2f8fd8;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .lodo{fill:none;stroke:#6b4a2b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .pac{fill:none;stroke:#e07b00;stroke-width:3.5;stroke-linecap:round}
      .cloro{fill:none;stroke:#8b5cf6;stroke-width:3.5;stroke-linecap:round}
      .cable{fill:none;stroke:#17252f;stroke-width:2}
      .lst{font-size:14px;fill:#17252f}
      .gpio{font-size:13px;fill:#5b6b77;font-weight:700}
      .panel{fill:#fff;stroke:#dbe3ea;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f6f9fb"/>

  <!-- Título -->
  <text x="40" y="52" class="tit">AquaAlerta · Maqueta del prototipo en cascada</text>
  <text x="40" y="80" class="sub">Fuente → R1 (coagulación y sedimentación) → filtrado → R2 (desinfección) → agua segura. R1 arriba, filtro en medio, R2 abajo: el agua baja por gravedad.</text>

  <!-- Piso y fuente -->
  <line x1="20" y1="950" x2="1160" y2="950" stroke="#c7d2db" stroke-width="3"/>
  <ellipse cx="200" cy="992" rx="165" ry="36" fill="#9cc8ea" stroke="#5f9cc8" stroke-width="3"/>
  <ellipse cx="140" cy="998" rx="40" ry="9" fill="#a8875a" opacity=".55"/>
  <ellipse cx="270" cy="985" rx="30" ry="7" fill="#a8875a" opacity=".55"/>
  <text x="200" y="1058" class="etapa" text-anchor="middle">Fuente: río · estero · vertiente</text>
  <!-- bomba sumergible -->
  <rect x="186" y="968" width="28" height="30" rx="6" fill="#3c4a55"/>
  <g class="num"><circle cx="234" cy="958" r="13"/><text x="234" y="963">1</text></g>

  <!-- 1. Entrada de agua cruda -->
  <path class="cruda" d="M200 968 V100 H415 V160"/>

  <!-- ===== R1 ===== -->
  <text x="292" y="150" class="etapa" text-anchor="middle">R1 · Coagulación</text>
  <text x="292" y="170" class="etapa" text-anchor="middle">y sedimentación</text>
  <!-- repisa alta -->
  <rect x="250" y="410" width="390" height="14" class="mueble"/>
  <line x1="262" y1="424" x2="262" y2="948" class="pata"/>
  <line x1="628" y1="424" x2="628" y2="948" class="pata"/>
  <!-- frasco -->
  <rect x="380" y="180" width="200" height="230" rx="18" class="vidrio"/>
  <g clip-path="url(#cR1)">
    <rect x="380" y="225" width="200" height="185" fill="#c9a66b" opacity=".55"/>
    <rect x="380" y="392" width="200" height="18" fill="#6b4a2b" opacity=".85"/>
    <g fill="#8a6239" opacity=".7">
      <circle cx="420" cy="300" r="3"/><circle cx="455" cy="330" r="2.5"/><circle cx="520" cy="310" r="3"/>
      <circle cx="545" cy="355" r="2.5"/><circle cx="430" cy="365" r="3"/><circle cx="500" cy="372" r="2.5"/>
    </g>
  </g>
  <rect x="380" y="180" width="200" height="230" rx="18" fill="none" stroke="#7a96a8" stroke-width="3"/>
  <rect x="400" y="160" width="160" height="22" rx="4" class="tapa"/>
  <!-- HC-SR04 R1 -->
  <rect x="510" y="144" width="42" height="16" rx="2" fill="#1f6fb2"/>
  <circle cx="521" cy="152" r="5" fill="#cfd8df"/><circle cx="541" cy="152" r="5" fill="#cfd8df"/>
  <g class="num"><circle cx="572" cy="132" r="13"/><text x="572" y="137">2</text></g>
  <!-- agitador -->
  <rect x="465" y="124" width="30" height="36" rx="4" fill="#3c4a55"/>
  <line x1="480" y1="182" x2="480" y2="340" stroke="#3c4a55" stroke-width="5"/>
  <rect x="448" y="336" width="64" height="12" rx="3" fill="#3c4a55"/>
  <path d="M440 316 a40 14 0 0 0 80 0" fill="none" stroke="#3c4a55" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <g class="num"><circle cx="480" cy="110" r="13"/><text x="480" y="115">3</text></g>
  <!-- PAC: bidón + bomba peristáltica -->
  <rect x="280" y="318" width="58" height="92" rx="8" fill="#fff3e0" stroke="#e07b00" stroke-width="3"/>
  <rect x="296" y="306" width="26" height="14" rx="3" fill="#e07b00"/>
  <text x="309" y="372" font-size="15" font-weight="700" fill="#e07b00" text-anchor="middle">PAC</text>
  <circle cx="309" cy="262" r="17" fill="#fff" stroke="#e07b00" stroke-width="3"/>
  <circle cx="309" cy="262" r="6" fill="#e07b00"/>
  <path class="pac" d="M309 306 V279"/>
  <path class="pac" d="M323 252 C360 220 420 210 440 182"/>
  <g class="num"><circle cx="276" cy="244" r="13"/><text x="276" y="249">4</text></g>
  <!-- turbidez R1 (fondo) -->
  <rect x="396" y="356" width="26" height="30" rx="4" fill="#1d3a4f"/>
  <path class="cable" d="M409 356 V196"/>
  <g class="num"><circle cx="356" cy="372" r="13"/><text x="356" y="377">5</text></g>
  <!-- TDS -->
  <path class="cable" d="M562 182 V292"/>
  <rect x="556" y="288" width="12" height="34" rx="4" fill="#e8edf1" stroke="#17252f" stroke-width="2"/>
  <g class="num"><circle cx="604" cy="304" r="13"/><text x="604" y="309">6</text></g>
  <!-- flotador -->
  <rect x="388" y="262" width="12" height="22" rx="6" fill="#f2c94c" stroke="#a07c12" stroke-width="2"/>
  <g class="num"><circle cx="356" cy="272" r="13"/><text x="356" y="277">7</text></g>
  <!-- grifo + electroválvula R1 → filtro -->
  <rect x="580" y="378" width="24" height="12" fill="#5b6b77"/>
  <path d="M612 374 l18 10 l-18 10 z M648 374 l-18 10 l18 10 z" fill="#3c4a55"/>
  <rect x="624" y="362" width="12" height="12" fill="#3c4a55"/>
  <g class="num"><circle cx="630" cy="344" r="13"/><text x="630" y="349">8</text></g>
  <path class="clara" d="M648 384 H730 V402"/>
  <!-- purga -->
  <path class="lodo" d="M500 410 V470"/>
  <path d="M488 470 l12 18 l12 -18 z M488 506 l12 -18 l12 18 z" fill="#3c4a55"/>
  <g class="num"><circle cx="534" cy="488" r="13"/><text x="534" y="493">9</text></g>
  <path class="lodo" d="M500 506 V870"/>
  <path d="M462 878 h76 l-8 66 h-60 z" fill="#d9c7a6" stroke="#8a6239" stroke-width="3"/>
  <text x="500" y="922" font-size="13" font-weight="700" fill="#6b4a2b" text-anchor="middle">Lodo</text>
  <text x="548" y="900" class="nota">riego /</text>
  <text x="548" y="916" class="nota">desagüe</text>

  <!-- ===== Filtro ===== -->
  <text x="730" y="376" class="etapa" text-anchor="middle" dx="34" dy="-34">Filtrado</text>
  <rect x="630" y="600" width="200" height="14" class="mueble"/>
  <line x1="642" y1="614" x2="642" y2="948" class="pata"/>
  <line x1="818" y1="614" x2="818" y2="948" class="pata"/>
  <rect x="660" y="402" width="140" height="198" rx="10" fill="#eef6fb" stroke="#7a96a8" stroke-width="3"/>
  <rect x="663" y="406" width="134" height="26" fill="#bcd9ec"/>
  <rect x="663" y="432" width="134" height="48" fill="url(#arena)"/>
  <rect x="663" y="482" width="134" height="42" fill="#2b2b2b"/>
  <rect x="663" y="526" width="134" height="34" fill="url(#gravilla)"/>
  <rect x="663" y="562" width="134" height="35" fill="url(#grava)"/>
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3">
    <line x1="663" y1="481" x2="797" y2="481"/><line x1="663" y1="525" x2="797" y2="525"/><line x1="663" y1="561" x2="797" y2="561"/>
  </g>
  <g font-size="13" fill="#17252f">
    <text x="810" y="461">Arena fina</text>
    <text x="810" y="508">Carbón activado</text>
    <text x="810" y="548">Gravilla</text>
    <text x="810" y="584">Grava gruesa</text>
  </g>
  <g class="num"><circle cx="818" cy="420" r="13"/><text x="818" y="425">10</text></g>
  <path class="filtrada" d="M730 600 V626 H930 V652"/>

  <!-- ===== R2 ===== -->
  <text x="1010" y="604" class="etapa" text-anchor="middle" dx="-30">R2 · Desinfección</text>
  <rect x="850" y="900" width="320" height="14" class="mueble"/>
  <line x1="862" y1="914" x2="862" y2="948" class="pata"/>
  <line x1="1158" y1="914" x2="1158" y2="948" class="pata"/>
  <rect x="880" y="670" width="200" height="230" rx="18" class="vidrio"/>
  <g clip-path="url(#cR2)"><rect x="880" y="715" width="200" height="185" fill="#7cb8e6" opacity=".55"/></g>
  <rect x="880" y="670" width="200" height="230" rx="18" fill="none" stroke="#7a96a8" stroke-width="3"/>
  <rect x="900" y="650" width="160" height="22" rx="4" class="tapa"/>
  <!-- HC-SR04 R2 -->
  <rect x="972" y="634" width="42" height="16" rx="2" fill="#1f6fb2"/>
  <circle cx="983" cy="642" r="5" fill="#cfd8df"/><circle cx="1003" cy="642" r="5" fill="#cfd8df"/>
  <g class="num"><circle cx="1030" cy="630" r="13"/><text x="1030" y="635">11</text></g>
  <!-- turbidez R2 bajo la caída del filtro -->
  <path d="M930 672 V700" stroke="#2f8fd8" stroke-width="4" stroke-dasharray="3 4"/>
  <rect x="918" y="752" width="24" height="28" rx="4" fill="#1d3a4f"/>
  <path class="cable" d="M936 752 V672"/>
  <g class="num"><circle cx="962" cy="790" r="13"/><text x="962" y="795">12</text></g>
  <!-- pH -->
  <path class="cable" d="M1042 672 V800"/>
  <rect x="1035" y="796" width="14" height="44" rx="6" fill="#e8edf1" stroke="#17252f" stroke-width="2"/>
  <g class="num"><circle cx="1012" cy="830" r="13"/><text x="1012" y="835">13</text></g>
  <!-- cloro -->
  <rect x="1094" y="790" width="54" height="110" rx="8" fill="#f3eefe" stroke="#8b5cf6" stroke-width="3"/>
  <rect x="1108" y="778" width="26" height="14" rx="3" fill="#8b5cf6"/>
  <text x="1121" y="850" font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle">Cloro</text>
  <text x="1121" y="866" font-size="12" fill="#8b5cf6" text-anchor="middle">5 %</text>
  <circle cx="1121" cy="728" r="17" fill="#fff" stroke="#8b5cf6" stroke-width="3"/>
  <circle cx="1121" cy="728" r="6" fill="#8b5cf6"/>
  <path class="cloro" d="M1121 778 V745"/>
  <path class="cloro" d="M1106 718 C1080 690 1060 676 1050 662"/>
  <g class="num"><circle cx="1150" cy="702" r="13"/><text x="1150" y="707">14</text></g>
  <!-- grifo de salida -->
  <rect x="856" y="874" width="24" height="12" fill="#5b6b77"/>
  <path d="M760 870 h50 l-6 64 h-38 z" fill="#e6f2fb" stroke="#5f9cc8" stroke-width="3"/>
  <rect x="765" y="890" width="40" height="40" fill="#7cb8e6" opacity=".6"/>
  <path class="filtrada" d="M856 880 C840 880 830 866 812 866" stroke-width="4"/>
  <g class="num"><circle cx="838" cy="850" r="13"/><text x="838" y="855">15</text></g>
  <text x="785" y="972" font-size="14" font-weight="700" fill="#1f9d55" text-anchor="middle">Agua segura</text>

  <!-- gravedad -->
  <path d="M1110 150 V560" stroke="#5b6b77" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#flecha)"/>
  <text x="1124" y="230" class="nota" transform="rotate(90 1124 230)">el agua baja por gravedad (cascada)</text>

  <!-- ===== Caja de control ===== -->
  <rect x="1180" y="110" width="390" height="430" rx="14" class="panel"/>
  <text x="1200" y="142" class="etapa">Caja de control</text>
  <rect x="1200" y="160" width="150" height="90" rx="8" fill="#1d3a4f"/>
  <rect x="1222" y="178" width="60" height="40" rx="3" fill="#b9c4cc"/>
  <text x="1275" y="238" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">ESP32</text>
  <path d="M1316 186 a16 16 0 0 1 22 0 M1311 180 a24 24 0 0 1 32 0" fill="none" stroke="#9cc8ea" stroke-width="2.5"/>
  <rect x="1370" y="160" width="180" height="62" rx="6" fill="#23395b"/>
  <rect x="1380" y="170" width="160" height="42" rx="3" fill="#7fd27f"/>
  <text x="1388" y="187" font-size="13" font-family="Liberation Mono, monospace" fill="#123">Agua lista</text>
  <text x="1388" y="205" font-size="13" font-family="Liberation Mono, monospace" fill="#123">R2  82%  pH 7.0</text>
  <text x="1460" y="240" class="nota" text-anchor="middle">LCD 16x2 · I2C 21/22</text>
  <rect x="1210" y="270" width="44" height="110" rx="10" fill="#2d3a44"/>
  <circle cx="1232" cy="295" r="12" fill="#d63c3c"/><circle cx="1232" cy="325" r="12" fill="#d69e0b"/><circle cx="1232" cy="355" r="12" fill="#1f9d55"/>
  <text x="1266" y="300" class="nota">Rojo 14 · alarma</text>
  <text x="1266" y="330" class="nota">Amarillo 27 · en proceso</text>
  <text x="1266" y="360" class="nota">Verde 26 · agua lista</text>
  <circle cx="1450" cy="296" r="16" fill="#3c4a55"/><circle cx="1450" cy="296" r="6" fill="#17252f"/>
  <text x="1474" y="301" class="nota">Buzzer 25</text>
  <circle cx="1450" cy="344" r="14" fill="#d63c3c" stroke="#7a2020" stroke-width="3"/>
  <text x="1474" y="349" class="nota">Botón 4</text>
  <g fill="#1f6fb2">
    <rect x="1210" y="400" width="48" height="34" rx="4"/><rect x="1266" y="400" width="48" height="34" rx="4"/>
    <rect x="1322" y="400" width="48" height="34" rx="4"/><rect x="1378" y="400" width="48" height="34" rx="4"/>
    <rect x="1434" y="400" width="48" height="34" rx="4"/><rect x="1490" y="400" width="60" height="34" rx="4" fill="#3c4a55"/>
  </g>
  <g font-size="11" fill="#fff" text-anchor="middle" font-weight="700">
    <text x="1234" y="421">15</text><text x="1290" y="421">32</text><text x="1346" y="421">33</text>
    <text x="1402" y="421">23</text><text x="1458" y="421">13</text><text x="1520" y="421">PWM 2</text>
  </g>
  <text x="1210" y="452" class="nota">Relés de bombas/válvulas · MOSFET del agitador</text>
  <text x="1210" y="476" class="nota">Fuente 12 V (bombas) + 5 V (ESP32) · GND común</text>
  <text x="1210" y="500" class="nota">WiFi propio "AquaAlerta" → 192.168.4.1 (sin internet)</text>
  <text x="1210" y="524" class="nota">Página: estado, gráficos, recipientes · /panel: red de aljibes</text>

  <!-- ===== Lista de componentes ===== -->
  <rect x="1180" y="560" width="390" height="500" rx="14" class="panel"/>
  <text x="1200" y="592" class="etapa">Componentes (GPIO del ESP32)</text>
  <g class="lst">
    <g class="num"><circle cx="1212" cy="619" r="11"/><text x="1212" y="623" font-size="11">1</text></g>
    <text x="1232" y="624">Bomba sumergible de entrada (o válvula)</text><text x="1555" y="624" class="gpio" text-anchor="end">15</text>
    <g class="num"><circle cx="1212" cy="647" r="11"/><text x="1212" y="651" font-size="11">2</text></g>
    <text x="1232" y="652">HC-SR04 nivel R1</text><text x="1555" y="652" class="gpio" text-anchor="end">16 / 17</text>
    <g class="num"><circle cx="1212" cy="675" r="11"/><text x="1212" y="679" font-size="11">3</text></g>
    <text x="1232" y="680">Agitador: motor DC + paleta (PWM)</text><text x="1555" y="680" class="gpio" text-anchor="end">2</text>
    <g class="num"><circle cx="1212" cy="703" r="11"/><text x="1212" y="707" font-size="11">4</text></g>
    <text x="1232" y="708">Bomba peristáltica + bidón de PAC</text><text x="1555" y="708" class="gpio" text-anchor="end">32</text>
    <g class="num"><circle cx="1212" cy="731" r="11"/><text x="1212" y="735" font-size="11">5</text></g>
    <text x="1232" y="736">Turbidez R1, cerca del fondo (lodo)</text><text x="1555" y="736" class="gpio" text-anchor="end">35</text>
    <g class="num"><circle cx="1212" cy="759" r="11"/><text x="1212" y="763" font-size="11">6</text></g>
    <text x="1232" y="764">Sensor TDS (sales disueltas)</text><text x="1555" y="764" class="gpio" text-anchor="end">39</text>
    <g class="num"><circle cx="1212" cy="787" r="11"/><text x="1212" y="791" font-size="11">7</text></g>
    <text x="1232" y="792">Flotador de nivel mínimo</text><text x="1555" y="792" class="gpio" text-anchor="end">19</text>
    <g class="num"><circle cx="1212" cy="815" r="11"/><text x="1212" y="819" font-size="11">8</text></g>
    <text x="1232" y="820">Grifo + electroválvula R1 → filtro</text><text x="1555" y="820" class="gpio" text-anchor="end">33</text>
    <g class="num"><circle cx="1212" cy="843" r="11"/><text x="1212" y="847" font-size="11">9</text></g>
    <text x="1232" y="848">Purga de lodo (válvula o bomba)</text><text x="1555" y="848" class="gpio" text-anchor="end">23</text>
    <g class="num"><circle cx="1212" cy="871" r="11"/><text x="1212" y="875" font-size="11">10</text></g>
    <text x="1232" y="876">Filtro de capas (lavado manual)</text><text x="1555" y="876" class="gpio" text-anchor="end">–</text>
    <g class="num"><circle cx="1212" cy="899" r="11"/><text x="1212" y="903" font-size="11">11</text></g>
    <text x="1232" y="904">HC-SR04 nivel R2</text><text x="1555" y="904" class="gpio" text-anchor="end">5 / 18</text>
    <g class="num"><circle cx="1212" cy="927" r="11"/><text x="1212" y="931" font-size="11">12</text></g>
    <text x="1232" y="932">Turbidez R2 (¿el filtro limpia?)</text><text x="1555" y="932" class="gpio" text-anchor="end">36</text>
    <g class="num"><circle cx="1212" cy="955" r="11"/><text x="1212" y="959" font-size="11">13</text></g>
    <text x="1232" y="960">Sensor de pH (PH-4502C)</text><text x="1555" y="960" class="gpio" text-anchor="end">34</text>
    <g class="num"><circle cx="1212" cy="983" r="11"/><text x="1212" y="987" font-size="11">14</text></g>
    <text x="1232" y="988">Bomba peristáltica + botella de cloro</text><text x="1555" y="988" class="gpio" text-anchor="end">13</text>
    <g class="num"><circle cx="1212" cy="1011" r="11"/><text x="1212" y="1015" font-size="11">15</text></g>
    <text x="1232" y="1016">Grifo de agua segura</text><text x="1555" y="1016" class="gpio" text-anchor="end">–</text>
  </g>
  <text x="1200" y="1044" class="nota">Medidas de R1 y R2 configurables desde la página.</text>

