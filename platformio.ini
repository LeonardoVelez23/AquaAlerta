[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Tiempos reales de un aljibe (coagulación ~45 min, contacto de cloro 30 min).
[env:esp32dev_real]
extends = env:esp32dev
build_flags = -DMODO_DEMO=0

; Pruebas de la lógica (include/control.h) en la PC: pio test -e native
[env:native]
platform = native
test_build_src = no

; Con Arduino UNO: el UNO llena R1, dosifica PAC y bate; manda los niveles por serie (GPIO16).
[env:esp32dev_uno]
extends = env:esp32dev
build_flags = -DUSAR_UNO=1
